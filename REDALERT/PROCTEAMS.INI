; PROCTEAMS.INI - Procedural Mission Generator: team presets
;
; Every preset section must be listed in [Teams].
;
;   Side        Allied, Soviet or Any
;   Role        Attack  = used for enemy attack waves
;               Defense = used as objective garrisons (Guard= in PROCOBJECTIVES.INI)
;   Threat      Scout, Light, Medium, Heavy, Overwhelming. Waves start low and escalate.
;   Weight      relative chance of being picked (default 10)
;   Members     TYPE:COUNT,... (max 5 entries). Count is scaled by difficulty WaveSize.
;   Missions    run in order after gathering:
;                 Attack:<Anything|Buildings|Harvesters|Infantry|Vehicles|Vessels|
;                         Factories|Defense|Threat|Power|Fakes>
;                 Hunt
;                 Guard:<tenths of a minute>
;                 Loop:<mission index>
;   Gather      yes = rally outside own base, then stage outside the target base first
;               (default yes for Attack teams)
;   Suicide     yes = keep attacking until dead
;   RoundAbout  yes = avoid the direct route
;
; A team is only used when every member exists at the current tech level, so
; low tech games automatically fall back to the infantry teams below.

[Teams]
1=SOV_DOG_PACK
2=SOV_RIFLE_SQUAD
3=SOV_GRENADIERS
4=SOV_FLAME_SQUAD
5=SOV_HEAVY_RAID
6=SOV_ARMOR_COLUMN
7=SOV_V2_STRIKE
8=SOV_HARV_HUNTERS
9=SOV_COMBINED_ARMS
10=SOV_MAMMOTH_SPEAR
11=SOV_IRON_FIST
12=ALL_RIFLE_SQUAD
13=ALL_ROCKET_SQUAD
14=ALL_JEEP_RAID
15=ALL_LIGHT_ARMOR
16=ALL_APC_ASSAULT
17=ALL_MEDIUM_ARMOR
18=ALL_ARTY_SIEGE
19=ALL_HARV_HUNTERS
20=ALL_COMBINED_ARMS
21=ALL_STEEL_WALL
22=GUARD_INFANTRY
23=GUARD_LIGHT
24=GUARD_HEAVY


