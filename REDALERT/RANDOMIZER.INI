; Red Alert Randomizer Configuration
; Place this file in your game data directory or mod folder
;
; Each object type listed under a category can be swapped with any of the
; types listed in its pool (comma-separated). Each preplaced instance is
; randomized independently.
;
; To disable a category, set Enabled=no
; To exclude a specific type from randomization, remove its line

[Randomizer]
; Master enable switch - set to yes to enable randomization
Enabled=yes
; Seed: 0 = use scenario seed for deterministic results per scenario
;       >0 = fixed seed (same randomization across all scenarios)
Seed=0

; ============================================================================
; BUILDING POOLS
; ============================================================================

[DefensiveBuildings]
Enabled=yes
; Allied defenses (INI names from BDATA.CPP)
PBOX=PBOX,HBOX,GUN         ; Pillbox -> Pillbox, Camo Pillbox, or Turret
HBOX=PBOX,HBOX,GUN         ; Camo Pillbox pool
GUN=PBOX,HBOX,GUN,AGUN     ; Turret pool (includes AA Gun)
AGUN=GUN,AGUN              ; AA Gun pool
; Soviet defenses
TSLA=TSLA,FTUR             ; Tesla Coil -> Tesla or Flame Tower
FTUR=TSLA,FTUR             ; Flame Tower pool
SAM=SAM,AGUN               ; SAM Site pool

[ProductionBuildings]
Enabled=no
; Uncomment to enable production building randomization
; WEAP=WEAP                ; War Factory
; BARR=BARR,TENT           ; Barracks/Tent
; TENT=BARR,TENT

; NOTE: Power Plants (POWR, APWR) are hardcoded to NEVER be swapped
; to preserve base power balance. This cannot be overridden.

; ============================================================================
; UNIT POOLS
; ============================================================================

[Tanks]
Enabled=yes
; Tank types (INI names from UDATA.CPP)
1TNK=1TNK,2TNK,3TNK,4TNK   ; Light Tank pool
2TNK=1TNK,2TNK,3TNK,4TNK   ; Medium Tank pool
3TNK=1TNK,2TNK,3TNK,4TNK   ; Heavy Tank pool
4TNK=1TNK,2TNK,3TNK,4TNK   ; Mammoth Tank pool

[Vehicles]
Enabled=yes
; Other vehicles
HARV=HARV                  ; Harvester (not randomized by default)
APC=APC,JEEP               ; APC pool
JEEP=APC,JEEP              ; Ranger pool
ARTY=ARTY,V2RL             ; Artillery pool
V2RL=ARTY,V2RL             ; V2 Launcher pool
MRJ=MRJ,MGG                ; Mobile Radar Jammer pool
MGG=MRJ,MGG                ; Mobile Gap Generator pool

; ============================================================================
; INFANTRY POOLS
; ============================================================================

[Infantry]
Enabled=yes
; Infantry types (INI names from IDATA.CPP)
E1=E1,E2,E3,E4             ; Rifle Infantry pool
E2=E1,E2,E3,E4             ; Grenadier pool
E3=E1,E2,E3,E4             ; Rocket Soldier pool
E4=E1,E2,E3,E4             ; Flamethrower pool
E6=E6                      ; Engineer (not randomized by default)
E7=E7                      ; Tanya (not randomized by default)
SPY=SPY,THF                ; Spy pool
THF=SPY,THF                ; Thief pool
MEDI=MEDI                  ; Medic (not randomized by default)
DOG=DOG                    ; Attack Dog (not randomized by default)

; ============================================================================
; VESSEL POOLS
; ============================================================================

[Vessels]
Enabled=yes
; Naval units (INI names from VDATA.CPP)
SS=SS,DD,CA                ; Submarine pool
DD=SS,DD,CA                ; Destroyer pool
CA=SS,DD,CA                ; Cruiser pool
PT=PT,LST                  ; Gunboat pool
LST=PT,LST                 ; Transport pool
