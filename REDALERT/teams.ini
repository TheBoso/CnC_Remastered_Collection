; =============================================================================
; teams.ini -- Skirmish AI Team Definitions for Red Alert
; =============================================================================
;
; Place this file in the same directory as RedAlert.dll / RedAlertI.dll.
;
; FACTION is determined from the House integer in each entry:
;   Allied houses: Spain=0, Greece=1, England=3, Germany=5, France=6, Turkey=7
;   Soviet houses: USSR=2, Ukraine=4
;   Use any Allied integer for an Allied team, any Soviet for a Soviet team.
;   At game start, each AI house receives its own copy of all faction-matching
;   teams, with the House field replaced by the actual multiplayer house id.
;
; ENTRY FORMAT (NewINIFormat >= 2 -- integers throughout):
;   <Name> = <HouseInt>,<Flags>,<RecruitPri>,<InitNum>,<MaxAllowed>,<Origin>,
;            <TriggerRaw>,<ClassCount>,<Type:Qty>,...,
;            <MissionCount>,<MissionInt:Arg>,...
;
; FLAGS bitmask:
;   1 = RoundAbout   (avoids high-threat cells)
;   2 = Suicide      (never retreats)
;   4 = Autocreate   (created when base is ALERTED -- not during normal production)
;   8 = Prebuilt     (AI builds members regardless of whether a team is active)
;  16 = Reinforce    (replaces fallen members)
;   Common combos:  24 = Prebuilt + Reinforce (normal recurring team)
;                   20 = Autocreate + Reinforce (alert-response team)
;                    8 = Prebuilt only (one-shot team that fights to the death)
;
; ORIGIN: waypoint index (0=A, 1=B, ..., 25=Z).  Use 0 for default.
; TRIGGER: raw CCPtr value; 0 = none.
;
; MISSION integers:
;    0 = Attack          1 = AttackWaypoint   2 = Formation
;    3 = Move            4 = MoveCell         5 = Guard
;    6 = Loop            7 = AttackTarcom     8 = Unload
;    9 = Deploy         10 = FollowFriendly  11 = Do
;   12 = SetGlobal      13 = Invulnerable    14 = Load
;   15 = Spy            16 = Patrol          17 = GatherAtBase
;   18 = GatherNearEnemy
;
; UNIT / INFANTRY NAMES (selection):
;   Infantry: E1 (Rifle), E2 (Grenadier), E4 (Flame), DOG, SPY, MEDI, MECH
;   Allied vehicles: 2TNK (Medium), 4TNK (Mammoth), ARTY, APC, JEEP
;   Soviet vehicles: 1TNK (Light), 3TNK (T-34), V2RL, MRJ (MAD), ARTY, APC
;
; DIFFICULTY (see [TeamDifficulty] section below):
;   Teams not listed are available at all difficulty levels.
; =============================================================================

[TeamTypes]

; -----------------------------------------------------------------------
; ALLIED TEAMS
; -----------------------------------------------------------------------

; AlliedScout -- 4 rifle infantry.
; Autocreate + Reinforce.  Available at all difficulties.
AlliedScout=1,20,1,1,3,0,0,1,E1:4,3,17:0,18:0,0:1

; AlliedRifles -- 6 rifle infantry rush.
; Autocreate + Reinforce.  Available at all difficulties.
AlliedRifles=1,20,4,1,2,0,0,1,E1:6,3,17:0,18:0,0:1

; AlliedAlertRush -- 4 riflemen + 1 medic, autocreate on ALERT.
; Autocreate + Reinforce.  Available at all difficulties.
AlliedAlertRush=1,20,5,1,2,0,0,2,E1:4,MEDI:1,3,17:0,18:0,0:1

; AlliedArmor -- 2 medium tanks.
; Autocreate + Reinforce.  Requires Normal difficulty or higher.
AlliedArmor=1,20,8,1,2,0,0,1,2TNK:2,3,17:0,18:0,0:1

; AlliedAlertArmor -- 2 medium tanks, autocreate on ALERT.
; Autocreate + Reinforce.  Requires Normal difficulty or higher.
AlliedAlertArmor=1,20,8,1,1,0,0,1,2TNK:2,3,17:0,18:0,0:1

; AlliedArty -- 2 artillery with a 4-infantry escort.
; Autocreate + Reinforce.  Requires Normal difficulty or higher.
AlliedArty=1,20,6,1,1,0,0,2,ARTY:2,E1:4,3,17:0,18:0,0:1

; AlliedHeavy -- 2 mammoth tanks.  Hard only.
AlliedHeavy=1,20,10,1,1,0,0,1,4TNK:2,3,17:0,18:0,0:1

; AlliedElite -- 2 mammoths + 2 medium tanks + medic.  Hard only, autocreate.
AlliedElite=1,20,10,1,1,0,0,3,4TNK:2,2TNK:2,MEDI:1,3,17:0,18:0,0:1

; -----------------------------------------------------------------------
; SOVIET TEAMS
; -----------------------------------------------------------------------

; SovietScout -- 4 infantry.  Available at all difficulties.
SovietScout=2,20,1,1,3,0,0,1,E1:4,3,17:0,18:0,0:1

; SovietFlames -- 4 flame infantry rush.  Available at all difficulties.
SovietFlames=2,20,4,1,2,0,0,1,E4:4,3,17:0,18:0,0:1

; SovietAlertZerg -- 6 flame infantry, autocreate on ALERT.
; Available at all difficulties.
SovietAlertZerg=2,20,5,1,2,0,0,1,E4:6,3,17:0,18:0,0:1

; SovietTanks -- 3 medium tanks.  Requires Normal difficulty or higher.
SovietTanks=2,20,8,1,2,0,0,1,3TNK:3,3,17:0,18:0,0:1

; SovietAlertTanks -- 2 medium tanks, autocreate on ALERT.
; Requires Normal difficulty or higher.
SovietAlertTanks=2,20,8,1,1,0,0,1,3TNK:2,3,17:0,18:0,0:1

; SovietV2 -- 2 V2 rockets + 4 flame-infantry escort.  Hard only.
SovietV2=2,20,9,1,1,0,0,2,V2RL:2,E4:4,3,17:0,18:0,0:1

; SovietElite -- 2 mammoth tanks + 1 medium tank.  Hard only.
SovietElite=2,20,10,1,1,0,0,2,4TNK:2,3TNK:1,3,17:0,18:0,0:1

; SovietAlertElite -- 1 mammoth + 3 medium tanks, autocreate on ALERT.  Hard only.
SovietAlertElite=2,20,10,1,1,0,0,2,4TNK:1,3TNK:3,3,17:0,18:0,0:1

; =============================================================================
; DIFFICULTY GATING
; Entries not listed here default to Easy (available at all difficulties).
; =============================================================================
[TeamDifficulty]
AlliedArmor=Normal
AlliedAlertArmor=Normal
AlliedArty=Normal
AlliedHeavy=Hard
AlliedElite=Hard
SovietTanks=Normal
SovietAlertTanks=Normal
SovietV2=Hard
SovietElite=Hard
SovietAlertElite=Hard
