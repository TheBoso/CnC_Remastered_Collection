; PROCMISSION.INI - Procedural Mission Generator: settings and difficulty
;
; HOW TO PLAY A PROCEDURAL MISSION
;   1. Add "Procedural=yes" to the [Basic] section of any skirmish map
;      (or set AllMaps=yes below to make every skirmish map procedural).
;   2. Start it from the skirmish lobby:
;        - Your country picks your side (Allied / Soviet).
;        - AI players on YOUR team fight with you.
;        - AI players on any OTHER team are enemies; each gets a pre-built base.
;        - The lobby Tech Level decides what can appear (low tech = infantry wars).
;   3. Objectives are announced a few seconds in. The primary objective decides
;      victory; bonus objectives pay out rewards.
;
; THE PRESET LIBRARY
;   PROCMISSION.INI     this file: generator settings + difficulty tables
;   PROCTEAMS.INI       attack wave and garrison teams
;   PROCBASES.INI       base layouts
;   PROCOBJECTIVES.INI  objectives / tasks
;
; PER-MAP OVERRIDES
;   Any [Generator] key can be overridden in the map's own [Procedural] section:
;
;     [Basic]
;     Procedural=yes
;
;     [Procedural]
;     Primary=SURVIVE_SIEGE
;     TechLevel=2
;     Difficulty=Hard
;
; Debug output from the generator is prefixed "ProcMission:" / "ProcINI:" in the
; GlyphX debug console.


[Generator]
; yes = every skirmish map is procedural, no Procedural=yes needed (handy for
; trying stock maps). Maps with Procedural=no are still left alone.
; Only applies to games with one human player, since this file is local to your PC.
AllMaps=no

; Easy, Normal, Hard or Random. (The skirmish lobby has no difficulty setting.)
Difficulty=Normal

; Name of a preset in PROCOBJECTIVES.INI, or RANDOM.
Primary=RANDOM

; Number of bonus objectives (picked at random in this range).
SecondaryMin=1
SecondaryMax=2

; 0 = use the lobby Tech Level. 1-10 forces that tech level for every player
; (same scale as the lobby slider; low values leave only the early units and structures).
TechLevel=0

; no  = enemy AIs only hold their generated bases (guard, repair, harvest, fight
;       back) and every attack comes from the waves below, so the presets and the
;       difficulty tables decide how hard a mission is. Recommended.
; yes = enemy AIs run the full skirmish AI as well: they build, expand and send
;       their own attacks on top of the waves (much harder, and less predictable).
EnemyProduction=no

; Enemy attack waves (the director). These are the enemy's attacks. An enemy with a
; shipyard / sub pen sometimes attacks by sea instead (NavalChance below).
Waves=yes
WaveMinSeconds=90
WaveMaxSeconds=180

; Base = waves roll out from next to the enemy base.
; Edge = waves drive in from the map edge closest to the enemy base.
SpawnMode=Base

; How the player's team starts:
;   MCV    = normal skirmish start
;   Base   = an established base from a Role=Defend preset in PROCBASES.INI
;   Random = Base with PlayerBaseChance %, otherwise MCV
; AllyStart (AI on your team) can also be Same = start the way the humans do.
; Objectives with PlayerBase= (e.g. SURVIVE_SIEGE) always give the humans a base.
PlayerStart=Random
AllyStart=Same
PlayerBaseChance=35

; yes = the director sends Role=Reinforce teams (PROCTEAMS.INI) to the humans, their AI
; allies and the enemies every few minutes (Player/Ally/EnemyReinforceMinutes below).
; They drive in from the map edge nearest the base. Squad missions get none for the
; humans; missions without waves get none for the enemy.
Reinforcements=yes

; yes = spectator mode: the human gets no base, MCV or units and the whole map is revealed.
; The AI on your lobby team fights the enemy on its own; both sides run the full skirmish AI
; (EnemyProduction is ignored) and the director still sends waves and reinforcements, at
; your AI allies. The primary is always "destroy all enemies" (no bonus objectives): your
; team wins when the enemy is wiped out and loses when every AI ally is gone.
; Needs at least one AI on your lobby team.
Spectate=no

; yes = enemies get small sentry posts across the map (how many: SentriesMin / SentriesMax
; in the difficulty tables below; the layouts are the Role=Sentry presets in PROCBASES.INI).
Sentries=yes

; yes = the director throws mid-mission events (PROCEVENTS.INI): an ally under attack calls for
; help, a player who is ahead gets a counter-attack, one who is behind gets reinforcements, a
; convoy to intercept, a downed pilot to rescue... Timing: EventFirstMinutes / EventMinMinutes /
; EventMaxMinutes in the difficulty tables. Not in squad or spectated missions.
Events=yes

; Keep the enemy's lobby starting units (the MCV is always removed for enemies with a base).
KeepStartUnits=no


; -----------------------------------------------------------------------------
; DIFFICULTY
;   EnemyCredits      % of the base preset's Credits given to each enemy
;   DefenseScale      % of the base preset's Defenses actually built
;   GuardScale        % of base / objective guards placed
;   WaveSize          % of each wave team's members
;   WaveInterval      % of the wave interval (and first wave delay); lower = more often
;   MaxActiveWaves    waves alive at once before the director waits
;   OutpostChance     % chance each enemy after the first gets an Outpost base
;   FirstWaveSeconds  quiet period before the first wave
;   StartThreat       Scout, Light, Medium, Heavy, Overwhelming
;   MaxThreat         highest threat the director escalates to
;   EscalateMinutes   threat rises one step every N minutes (also when enemy bases lose buildings)
;   NavalChance       % of waves from a house with a naval yard that come by sea (when they can)
;   FactoryScale      % of each enemy base preset's factories (barracks, war factory, airfield,
;                     helipad) and refineries built; the fraction is a chance of one more
;                     (160 = a single war factory becomes two 60% of the time). Never below one.
;   Superweapons      structures added to every enemy main base, e.g. MSLO,IRON,PDOX. Each enemy
;                     builds the ones its side can own (Soviet: Missile Silo + Iron Curtain,
;                     Allied: Missile Silo + Chronosphere); the director fires the Iron Curtain /
;                     Chronosphere,
;                     the AI fires its nukes itself.
;   PlayerReinforceMinutes  reinforcements for the humans every N minutes (0 = never)
;   AllyReinforceMinutes    ... for AI allies
;   EnemyReinforceMinutes   ... for enemies (they join the base's defence)
;
;   When your team starts with a pre-built base (PlayerStart=Base, or the PlayerBaseChance
;   roll) you have defences and factories from the first minute, so the waves come harder.
;   Objectives that give you the base themselves (Survive, Hold the Line, Protect) carry
;   their own pressure keys and ignore these.
;   BaseStartWaveRate    waves come this % as often (130 = 1.3x as often)
;   BaseStartWaveSize    % of each wave team's members, on top of WaveSize
;   BaseStartFirstWave   % of FirstWaveSeconds (lower = the first wave comes sooner)
;   BaseStartThreat      start this many threat steps higher (never above MaxThreat)
;   BaseStartExtraWaves  added to MaxActiveWaves
;
;   MinConstructionYards  enemy main bases get at least this many construction yards (extras sit
;                     4-10 cells from the first), so one lucky strike doesn't end their rebuilding
;   MinRefineries     ... and at least this many refineries (after FactoryScale), each extra one
;                     with its own harvester
;
;   EventFirstMinutes  quiet period before the first mid-mission event (PROCEVENTS.INI)
;   EventMinMinutes / EventMaxMinutes  gap between events (random in this range)
;
;   SentriesMin / SentriesMax  small enemy posts (Role=Sentry in PROCBASES.INI) scattered
;                     across the map, held by the nearest enemy: a turret or two and a few
;                     guards on the way to their base. Not in squad missions. (Sentries=no
;                     in [Generator] turns them off.)
; -----------------------------------------------------------------------------

[Easy]
