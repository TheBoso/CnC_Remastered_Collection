; PROCOBJECTIVES.INI - Procedural Mission Generator: objective (task) presets
;
; Every preset section must be listed in [Objectives].
;
; Each mission gets ONE primary objective (wins / loses the game) and a few
; bonus objectives (rewards only). Destroying every enemy always wins too.
;
;   Kind        DestroyBases  defeat every enemy house
;               Survive       survive until the timer runs out
;               Destroy       destroy the target structure
;               Capture       capture the target structure with an engineer
;               Protect       keep the target structure alive until the timer runs out
;   Slot        Primary, Secondary or Either (DestroyBases / Survive are primary only)
;   PlayerSide  Allied, Soviet or Any - only offered when the player is on this side
;   MinTech     only offered at this tech level or above (Capture needs engineers)
;   Weight      relative chance of being picked (default 10)
;   MinMinutes  Survive / Protect: duration. Destroy / Capture: optional time limit.
;   MaxMinutes  the actual value is picked in [MinMinutes, MaxMinutes]
;   Targets     STRUCT,... one is picked, preferring what the owner could really have
;   Owner       Enemy   = placed inside an enemy base
;               Neutral = placed away from every base (guarded by an enemy)
;               Player  = placed in the player's base (only offered when the player
;                         starts with a base)
;               Outpost = placed in a small enemy outpost built away from every base
;                         (OutpostBase= picks the layout, AUTO = a random Outpost).
;                         Outposts never get their own construction yard, so a FACT
;                         target is the one to capture.
;   Guard       team preset from PROCTEAMS.INI placed around the target
;   PlayerBase  primary only: AUTO = human players start with a Defend base from
;               PROCBASES.INI instead of an MCV (or name a specific preset)
;   RewardCredits, RewardUnits=TYPE:COUNT,...   bonus objective rewards
;   Text        shown to the player; %d is replaced by the minutes
;
; SQUAD MISSIONS (primary objectives only)
;   PlayerStart=Squad    humans start with a squad instead of an MCV or base
;   Squad               squad presets from PROCTEAMS.INI; the first one for the
;                        player's side is used (list one per side)
;   PlayerCredits        starting credits (-1 = keep the lobby credits)
;   Waves                yes / no, overrides the generator setting
;   WaveDelaySeconds     first wave delay (0 = difficulty FirstWaveSeconds)
;   EnemyProduction      no = enemy AIs never build or expand (static, like campaign maps)
;   Patrols              patrol teams looping around the targets, outposts and enemy bases
;   Bonus                bonus objective always added with this primary
;   The mission is lost when the whole squad dies (and nothing else is left).

[Objectives]
1=DESTROY_ALL
2=SURVIVE_SIEGE
3=DESTROY_COMMAND
