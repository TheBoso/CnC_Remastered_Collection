; PROCMISSION_EXAMPLE.INI - Example/Documentation for Procedural Mission System
;
; The Procedural Mission system uses multiple INI files:
;
; 1. PROCMISSION.INI (Master Config)
;    - Team pool definitions (Team1, Team2, etc.)
;    - Map pool (Map1, Map2, etc.)
;    - Menu mission entries (MenuMission1, MenuMission2, etc.)
;
; 2. Individual Mission Files (e.g., PROC_ALLIED.INI, PROC_SOVIET.INI)
;    - Mission definition
;    - Player configuration
;    - Enemy base configurations
;    - Director rules
;    - Difficulty settings
;
; HOW THE SYSTEM WORKS:
; 1. On game start, PROCMISSION.INI is loaded
;    - Team compositions are parsed into memory pools
;    - Map pool is populated
;    - Menu missions are registered
;
; 2. When player selects a procedural mission from menu:
;    - The mission INI file is loaded
;    - Template map is loaded
;    - Player/Enemy assets are spawned at waypoints
;    - Director is initialized with rules
;
; 3. During gameplay:
;    - Director monitors game state
;    - After anti-rush period, Director spawns attack waves
;    - Teams are created from pools based on threat level
;    - Threat escalates as player destroys enemy buildings
;
; TEAM DEFINITION FORMAT (in PROCMISSION.INI):
; [TeamN]
; Name=8CHARNAM          ; 8 character unique name
; Pool=SOVIET_ATTACK     ; Which pool: SOVIET_ATTACK, SOVIET_PATROL, SOVIET_DEFENSE,
;                        ;             ALLIED_ATTACK, ALLIED_PATROL, ALLIED_DEFENSE, SPECIAL
; House=USSR             ; House this team belongs to
; ThreatLevel=LIGHT      ; SCOUT, LIGHT, MEDIUM, HEAVY, OVERWHELMING
; Composition=3TNK:3,E1:4 ; TYPE:QUANTITY pairs
; Missions=ATTACK:BUILDINGS ; MISSION:DATA pairs
; Priority=7             ; Recruit priority (0-15)
; RoundAbout=no          ; Take indirect path?
; Suicide=no             ; Fight to death?
;
; MISSION COMMANDS:
; ATTACK:quarry   - Attack targets (ANYTHING, BUILDINGS, HARVESTERS, INFANTRY, VEHICLES, DEFENSE, THREAT)
; PATROL:waypoint - Patrol to waypoint number
; MOVE:waypoint   - Move to waypoint
; GUARD:duration  - Guard area for duration
; LOOP:index      - Loop back to mission at index
;
; REGION MAPPINGS (in mission INI files):
; Base_A       -> Waypoint 0  - Player starting base
; Base_B       -> Waypoint 1  - Primary enemy base
; Base_C       -> Waypoint 2  - Secondary enemy base
; Choke_1      -> Waypoint 3  - Defensive chokepoint
; Choke_2      -> Waypoint 4  - Secondary chokepoint
; Expansion_1  -> Waypoint 5  - Resource expansion
; Expansion_2  -> Waypoint 6  - Resource expansion
; Entry_North  -> Waypoint 7  - Reinforcement entry
; Entry_South  -> Waypoint 8  - Reinforcement entry
; Entry_East   -> Waypoint 9  - Reinforcement entry
; Entry_West   -> Waypoint 10 - Reinforcement entry
; Patrol_1     -> Waypoint 11 - Patrol waypoint
; Patrol_2     -> Waypoint 12 - Patrol waypoint
; Objective_1  -> Waypoint 13 - Mission objective
;
; See PROC_ALLIED.INI and PROC_SOVIET.INI for complete mission examples.
