; PROCBASES.INI - Procedural Mission Generator: base layout presets
;
; Plain data: edit, add or remove presets and the next mission picks them up (no rebuild).
; Every preset section must be listed in [Bases] (up to 64).
;
;   Side        Allied, Soviet or Any
;   Role        Main    = full enemy base (the first enemy always gets one)
;               Outpost = smaller enemy base (extra enemies, see OutpostChance)
;               Defend  = base handed to the player by objectives with PlayerBase=AUTO
;               Camp    = lightly held enemy camp, only built for objectives with
;                         OutpostBase=CAMP (e.g. the construction yard a squad captures)
;               Sentry  = small fortified post scattered across the map, held by the
;                         nearest enemy (SentriesMin / SentriesMax in PROCMISSION.INI).
;                         No construction yard; give its defenses a small radius (e.g. 1:4).
;   MinTech     preset is only picked at this tech level or above
;   Weight      relative chance of being picked (default 10)
;   WeightEasy / WeightNormal / WeightHard
;               the weight at that difficulty (default Weight; 0 = never at that difficulty)
;   Credits     money given to the owning AI (scaled by difficulty EnemyCredits)
;   Structures  TYPE[:COUNT[:MINRADIUS[:MAXRADIUS]]],...   radius in cells from the start point.
;               For enemies, factories (TENT, BARR, WEAP, AFLD, HPAD) and refineries are
;               scaled by the difficulty FactoryScale.
;   Defenses    same format; COUNT is scaled by difficulty DefenseScale.
;               Default radius for defenses is 7-13 (a perimeter ring).
;   Guards      TYPE:COUNT,... units placed around the base (scaled by GuardScale)
;   Harvesters  harvesters placed if the base got a refinery
;   AutoPower   yes = add power plants until power covers drain (default yes)
;   Naval       yes = add a naval yard / sub pen if water is within 20 cells
;
; Enemy main bases also get the difficulty's Superweapons (PROCMISSION.INI).
; Anything the owner cannot have at the current tech level or side is skipped
; (except FACT), so one preset scales from tech 1 to tech 10. Barracks: TENT is the
; Allied one, BARR the Soviet one.
; List FACT first with radius 0 so it sits on the start point.

[Bases]
1=SOV_MAIN_STANDARD
2=SOV_MAIN_FORTRESS
3=SOV_OUTPOST_FORWARD
4=SOV_OUTPOST_RADAR
5=ALL_MAIN_STANDARD
6=ALL_MAIN_FORTRESS
7=ALL_OUTPOST_FORWARD
8=ALL_OUTPOST_RADAR
9=SOV_DEFEND
10=ALL_DEFEND
11=SOV_DEFEND_CAMP
12=ALL_DEFEND_CAMP
13=SOV_CAMP
14=ALL_CAMP
15=SOV_MAIN_ARMOR
