; spectator.ini -- Place this file next to RedAlert.dll / RedAlertI.dll.
;
; When Enable=yes, the human player (always MULTI1 in GlyphX skirmish) is
; immediately defeated at game start. The built-in post-defeat observation
; camera activates so you can watch AI vs AI play out.
;
; The game ends when only one AI house remains (num_alive == 1).
; Set Enable=no or delete this file to return to normal play.

[Spectator]
Enable=yes
