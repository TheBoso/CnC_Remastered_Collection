; PROCEVENTS.INI - Procedural Mission Generator: mid-mission events (the director's twists)
;
; Plain data: edit, add or remove events and the next mission picks them up (no rebuild).
; Every event section must be listed in [Events] (up to 32).
;
; A few minutes into the mission (EventFirstMinutes in the difficulty tables) and then every
; EventMinMinutes-EventMaxMinutes, the director reads the situation and throws one event that
; fits it. Events made for the situation at hand (When= other than Any) are three times as
; likely as the ones that can happen any time. Not in squad or spectated missions;
; Events=no in [Generator] turns them off.
;
;   Kind        Objective      a surprise bonus objective: Objective= names a Slot=Event preset
;                              in PROCOBJECTIVES.INI (placed then and there, revealed and pinged)
;               Counterattack  extra waves at the player, from the enemy with the most buildings
;               Reinforce      reinforcements for the humans right away (Role=Reinforce teams)
;   When        the situations it waits for, any of them (default Any):
;                 Any           always
;                 Ahead         an enemy has lost a quarter of its buildings
;                 Behind        the humans have lost 30% of their buildings (from their peak)
;                 AllyAttacked  an AI ally's base took damage in the last minute
;                 SentryLost    a sentry post was wiped out in the last two minutes
;                 Quiet         no wave out, none sent for a minute
;   Weight      relative chance (default 10; 0 = never)
;   MinMinutes  not before this many minutes into the mission
;   Once        yes (default) = at most once per mission
;   Waves       Objective: enemy waves sent at it (an ally's base under attack, or the objective's
;               spot, which they move to and hold). Counterattack: how many waves (default 1).
;               Reinforce: how many reinforcement teams (default 1).
;   ThreatBoost Counterattack: threat steps above what the director would send
;   PlayerSide, MinTech   as for objectives
;   Text        announced when it fires (before the objective's own text)

[Events]
1=ALLY_DISTRESS
2=CONVOY
3=SUPPLY_DROP
4=DOWNED_PILOT
5=COMMANDER_SPOTTED
6=COUNTERATTACK
7=REVENGE_RAID
8=EMERGENCY_REINFORCEMENTS
9=BLITZ


; -----------------------------------------------------------------------------
; Surprise objectives
; -----------------------------------------------------------------------------

; An AI ally's base is being hit: the enemy piles on and you are asked to hold it.
[ALLY_DISTRESS]
Kind=Objective
Objective=EVENT_ALLY_DISTRESS
When=AllyAttacked
Weight=20
Waves=2
Once=no
Text=Your ally is under heavy attack and calls for help!

[CONVOY]
Kind=Objective
Objective=EVENT_CONVOY
When=Any
Weight=10
Text=Intercepted transmission: an enemy supply convoy is on the move.

; A prize in no-man's land, and the enemy wants it too.
[SUPPLY_DROP]
Kind=Objective
Objective=EVENT_SUPPLY_DROP
When=Behind,Quiet
Weight=10
Waves=1
Once=no
Text=A supply plane went down between the lines!

[DOWNED_PILOT]
Kind=Objective
Objective=EVENT_DOWNED_PILOT
When=Any
Weight=8
Waves=1
Text=One of our pilots was shot down behind enemy lines.

[COMMANDER_SPOTTED]
Kind=Objective
Objective=EVENT_COMMANDER_SPOTTED
When=Ahead,Quiet
Weight=8
MinMinutes=8
Text=Enemy commander spotted at a forward camp!


; -----------------------------------------------------------------------------
; The enemy reacts
; -----------------------------------------------------------------------------

; Doing well? They hit back harder.
[COUNTERATTACK]
Kind=Counterattack
When=Ahead
Weight=15
Waves=2
ThreatBoost=1
Once=no
Text=The enemy is regrouping for a counter-attack!

[REVENGE_RAID]
Kind=Counterattack
When=SentryLost
Weight=15
Waves=1
ThreatBoost=1
Once=no
Text=The enemy wants its outpost back: a strike force is on the way!

; A long lull ends with a bang.
[BLITZ]
Kind=Counterattack
When=Quiet
Weight=6
Waves=2
ThreatBoost=2
MinMinutes=12
Text=Radar picks up a large enemy force on the move!


; -----------------------------------------------------------------------------
; Help
; -----------------------------------------------------------------------------

[EMERGENCY_REINFORCEMENTS]
Kind=Reinforce
When=Behind
Weight=20
Waves=2
Once=no
Text=Command is sending emergency reinforcements!
